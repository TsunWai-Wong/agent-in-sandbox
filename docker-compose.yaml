services:
  # pgvector's image rather than plain postgres: the extension has to exist in
  # the server before `CREATE EXTENSION vector` can succeed, and installing it
  # into the stock image at runtime means doing it again on every fresh volume.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres-agent-memory
    environment:
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=agent
      - POSTGRES_DB=agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix-agent-in-sandbox
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    ports:
      - "6006:6006"   # UI and OTLP HTTP collector
      - "4317:4317"   # OTLP gRPC collector
    volumes:
      - phoenix_data:/mnt/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    container_name: elasticsearch-agent-in-sandbox
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  phoenix_data:
  postgres_data:
  es_data:
